<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerLogic PM5350 — Cloud Energy Monitor</title>
  <link href="https://cloudflare.com" rel="stylesheet">
  <!-- Connects directly to the free Cloud MQTT Broker -->
  <script src="https://unpkg.com"></script>
  <style>
    body { background-color: #f4f6f9; }
    .card { border: none; border-radius: 12px; }
    .tag-value { font-size: 2.8rem; font-weight: 700; color: #0d6efd; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">⚡ Energy Monitoring System</span>
      <span class="badge bg-light text-dark">Status: <span id="_status">Connecting...</span></span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4 justify-content-center">

      <!-- Card 1: Active Energy Delivered -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm p-4 text-center">
          <h6 class="text-muted text-uppercase">Active Energy Delivered</h6>
          <div class="my-3">
            <span class="tag-value" id="Edel_MWh">--</span>
            <span class="fs-5 text-secondary">MWh</span>
          </div>
          <small class="text-muted">Meter: Schneider PM5350</small>
        </div>
      </div>

      <!-- Card 2: System Frequency -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm p-4 text-center">
          <h6 class="text-muted text-uppercase">System Frequency</h6>
          <div class="my-3">
            <span class="tag-value" id="Freq_Hz">--</span>
            <span class="fs-5 text-secondary">Hz</span>
          </div>
          <small class="text-muted">Meter: Schneider PM5350</small>
        </div>
      </div>

    </div>

    <div class="text-center text-muted small mt-4">
      Last Updated: <span id="_lastUpdated">Waiting for gateway...</span>
    </div>
  </div>

  <script>
    const TOPIC = 'softech/pm5350/site01/telemetry';
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      document.getElementById('_status').innerText = 'Online (Cloud)';
      client.subscribe(TOPIC);
    });

    client.on('message', (topic, message) => {
      try {
        const parsed = JSON.parse(message.toString());
        const tags = {};

        // Unpacks BL104L sensorDatas array automatically
        if (Array.isArray(parsed.sensorDatas)) {
          parsed.sensorDatas.forEach(item => {
            const key = item.flag || item.name;
            if (key !== undefined) tags[key] = item.value;
          });
        } else {
          Object.assign(tags, parsed);
        }

        for (const [tagName, value] of Object.entries(tags)) {
          const el = document.getElementById(tagName);
          if (el) {
            el.innerText = typeof value === 'number' ? value.toFixed(4) : value;
          }
        }
        document.getElementById('_lastUpdated').innerText = new Date().toLocaleTimeString();
      } catch (e) {}
    });

    client.on('offline', () => {
      document.getElementById('_status').innerText = 'Reconnecting...';
    });
  </script>

</body>
</html>
