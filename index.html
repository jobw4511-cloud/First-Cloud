<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerLogic PM5350 Dashboard</title>
<link href="bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.9/js/bootstrap.min.js">
<link href="https://cloudflare.com" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card { border: none; border-radius: 12px; }
    .tag-value { font-size: 2.8rem; font-weight: 700; color: #0d6efd; }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-dark text-center bg-primary shadow-sm mb-4">
    <div class="container text-center">
      <span class="navbar-brand text-center fw-bold">⚡ Energy Monitoring System</span>
      <span class="badge bg-light text-dark">Status: <span id="_status">Connecting...</span></span>
    </div>
  </nav>

  <!-- Main Dashboard Grid -->
  <div class="container">
    <div class="row g-4">

      <!-- Card 1: Active Energy Delivered (Matches your BL104L Variable Key "Edel_MWh") -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm p-4 text-center">
          <h6 class="text-muted text-uppercase">Active Energy Delivered</h6>
          <div class="my-3">
            <span class="tag-value" id="Edel_MWh">--</span>
            <span class="fs-5 text-secondary">MWh</span>
          </div>
          <small class="text-muted">Meter: Schneider PM5350</small>
        </div>
      </div>

      <!-- Card 2: Frequency (Matches BL104L Variable Key "Freq_Hz") -->
<div class="col-md-6 col-lg-4">
  <div class="card shadow-sm p-4 text-center">
    <h6 class="text-muted text-uppercase">System Frequency</h6>
    <div class="my-3">
      <span class="tag-value" id="Freq_Hz">--</span>
      <span class="fs-5 text-secondary">Hz</span>
    </div>
    <small class="text-muted">Meter: Schneider PM5350</small>
  </div>
</div>


      <!-- To add more parameters later (like Voltage or Current), just copy-paste a card and change id="..." -->

    </div>

    <div class="text-center text-muted small mt-4">
      Last Updated: <span id="_lastUpdated">--</span>
    </div>
  </div>

  <!-- Auto-Sync Script (Connects your HTML IDs to your BL104L tags automatically) -->
  <script>
    async function syncAnalyzerTags() {
      try {
        const res = await fetch('/api/tags');
        const tags = await res.json();

        for (const [tagName, value] of Object.entries(tags)) {
          const el = document.getElementById(tagName);
          if (el) {
            el.innerText = typeof value === 'number' ? value.toFixed(4) : value;
          }
        }
      } catch (e) {
        console.error('Waiting for server...');
      }
    }
    setInterval(syncAnalyzerTags, 2000);
    syncAnalyzerTags();
  </script>

</body>
</html>
